<!DOCTYPE html>
<html>
<head>
    <title>GeoJSON on Google Maps</title>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        let map;

        function initMap() {
            // 1. Initialize map centered over Nepal (where your office area is)
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12, 
                center: { lat: 27.7172, lng: 85.3240 }, // Approximate center of Kathmandu/Nepal (adjust if needed)
                mapTypeId: "roadmap"
            });

            // 2. Your Raw GitHub GeoJSON file URL
            const geoJsonUrl = "https://raw.githubusercontent.com/manojpantha/manojpantha.github.io/main/img/Basin_office_area.geojson";
            
            // 3. Load the GeoJSON file into the Google Maps Data Layer
            map.data.loadGeoJson(geoJsonUrl);

            // 4. Style your GeoJSON features
            map.data.setStyle({
                fillColor: "red",
                strokeColor: "blue",
                strokeWeight: 2
            });
        }
    </script>

    <!-- Load the Google Maps JavaScript API with your API key -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCQFFCCiim3TYARvBpbtziqMI9ZPMVp0jw&callback=initMap">
    </script>

</body>
</html>
